[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bead-rl"
version = "0.1.0"
description = "Reinforcement learning for autonomous bead path tracing on image-derived contours"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "opencv-python>=4.8,<5",
  "matplotlib>=3.8,<4",
  "gymnasium>=1.2,<2",
  "stable-baselines3>=2.8,<3",
  "torch>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
